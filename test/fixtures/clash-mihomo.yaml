# A mihomo config in the shape subscriptions hand out: anchors, emoji names, every proxy type
# the importer maps, a few it can't, and the usual group layout.
mixed-port: 7890
mode: rule
dns:
  enable: true
  nameserver: [223.5.5.5]

x-tls: &tls
  tls: true
  skip-cert-verify: false
  client-fingerprint: chrome

proxies:
  - name: 🇭🇰 香港 01
    type: ss
    server: hk1.example.org
    port: 8388
    cipher: 2022-blake3-aes-128-gcm
    password: "AAAAAAAAAAAAAAAAAAAAAA=="
    udp: true
    udp-over-tcp: true
    udp-over-tcp-version: 2
  - name: 🇭🇰 香港 02 obfs
    type: ss
    server: hk2.example.org
    port: 8388
    cipher: aes-128-gcm
    password: p
    plugin: obfs
    plugin-opts: { mode: tls, host: bing.com }
  - name: 🇯🇵 日本 ShadowTLS
    type: ss
    server: jp1.example.org
    port: 443
    cipher: 2022-blake3-aes-128-gcm
    password: "AAAAAAAAAAAAAAAAAAAAAA=="
    client-fingerprint: chrome
    plugin: shadow-tls
    plugin-opts: { host: www.apple.com, password: stpass, version: 3 }
  - name: 🇯🇵 日本 VMess WS
    type: vmess
    server: jp2.example.org
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    alterId: 0
    cipher: auto
    network: ws
    servername: jp2.example.org
    ws-opts:
      path: /ray?ed=2048
      headers: { Host: jp2.example.org }
    <<: *tls
  - name: 🇺🇸 美国 Reality
    type: vless
    server: us1.example.org
    port: 443
    uuid: 22222222-2222-2222-2222-222222222222
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    reality-opts: { public-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0, short-id: 0123abcd }
    <<: *tls
  - name: 🇺🇸 美国 gRPC
    type: vless
    server: us2.example.org
    port: 443
    uuid: 33333333-3333-3333-3333-333333333333
    network: grpc
    grpc-opts: { grpc-service-name: svc }
    <<: *tls
  - name: 🇸🇬 新加坡 Trojan
    type: trojan
    server: sg1.example.org
    port: 443
    password: p
    sni: sg1.example.org
    alpn: [h2, http/1.1]
    smux: { enabled: true, protocol: h2mux, max-connections: 4 }
  - name: 🇸🇬 新加坡 Hy2
    type: hysteria2
    server: sg2.example.org
    port: 443
    ports: 20000-50000
    hop-interval: 30
    password: p
    up: "50 Mbps"
    down: 300
    obfs: salamander
    obfs-password: o
    sni: sg2.example.org
  - name: 🇹🇼 台湾 TUIC
    type: tuic
    server: tw1.example.org
    port: 443
    uuid: 44444444-4444-4444-4444-444444444444
    password: p
    congestion-controller: bbr
    udp-relay-mode: native
    reduce-rtt: true
    heartbeat-interval: 10000
  - name: 🇹🇼 台湾 AnyTLS
    type: anytls
    server: tw2.example.org
    port: 443
    password: p
    idle-session-timeout: 30
    client-fingerprint: chrome
  - name: 🇰🇷 韩国 Hysteria
    type: hysteria
    server: kr1.example.org
    port: 443
    auth-str: a
    up: 30 Mbps
    down: 200 Mbps
    sni: kr1.example.org
  - name: 🇰🇷 韩国 Snell
    type: snell
    server: kr2.example.org
    port: 443
    psk: p
    version: 4
    obfs-opts: { mode: http, host: bing.com }
  - name: 🇬🇧 英国 HTTPUpgrade
    type: vmess
    server: uk1.example.org
    port: 80
    uuid: 66666666-6666-6666-6666-666666666666
    alterId: 0
    cipher: aes-128-gcm
    network: ws
    ws-opts: { path: /up, headers: { Host: cdn.example.org }, v2ray-http-upgrade: true }
  - name: 机房 SSH
    type: ssh
    server: 198.51.100.4
    port: 22
    username: root
    password: p
    host-key: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE/TmZBaitXAII0KSvBufEZFKnpLV6le1lwxA/1Wrl8l"]
  - name: 家里 WireGuard
    type: wireguard
    server: 203.0.113.1
    port: 51820
    ip: 10.0.0.2
    ipv6: fd00::2
    private-key: YNXtAzepDqRv9H52osJVDQnznT5AM11eCK3ESpwSt04=
    public-key: Z1XXLsKYkYxuiYjJIkRvtIKFepCYHTgON+GwPq7SOV4=
    reserved: [1, 2, 3]
    mtu: 1408
  - name: 跳板 SOCKS
    type: socks5
    server: 198.51.100.1
    port: 1080
    username: u
    password: p
    udp: false
  - name: 落地 HTTP
    type: http
    server: 198.51.100.2
    port: 8080
    dialer-proxy: 跳板 SOCKS
  - name: 经组出去
    type: http
    server: 198.51.100.3
    port: 8080
    dialer-proxy: 🚀 节点选择
  - name: 老 SSR
    type: ssr
    server: old.example.org
    port: 443
    cipher: aes-256-cfb
    password: p
    obfs: plain
    protocol: origin
  - name: XHTTP
    type: vless
    server: x.example.org
    port: 443
    uuid: 55555555-5555-5555-5555-555555555555
    network: xhttp
    tls: true
  - name: 直连
    type: direct

proxy-providers:
  机场:
    type: http
    url: https://sub.example.org/clash
    path: ./providers/airport.yaml

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🔗 链式, DIRECT, 老 SSR]
    use: [机场]
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-filter: "(?i)wireguard|socks|http"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
  - name: 🇭🇰 香港节点
    type: fallback
    include-all-proxies: true
    filter: 香港
    interval: 180
  - name: 🔗 链式
    type: relay
    proxies: [🇭🇰 香港 01, 🇺🇸 美国 Reality]
  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, 🛑 广告拦截, DIRECT]

rules:
  - GEOIP,CN,DIRECT
  - MATCH,🐟 漏网之鱼
